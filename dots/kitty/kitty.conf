# kitty config from hi-shell (install.sh puts it in ~/.config/kitty; your previous
# kitty.conf is kept next to it as kitty.conf.backup-<date>). Edit freely.

# Colors follow the wallpaper (written by hi-shell's services/TerminalColors.qml;
# kitty reloads them when the palette changes).
include ~/.local/state/hi-shell/terminal/kitty-theme.conf

# --- Font ---
font_family JetBrainsMono Nerd Font
font_size 11.0
disable_ligatures cursor

# --- Window ---
window_padding_width 14
# Translucent; Hyprland blurs what's behind.
background_opacity 0.92
confirm_os_window_close 0
remember_window_size no
enable_audio_bell no
visual_bell_duration 0.15
shell fish

# --- Cursor ---
cursor_shape beam
cursor_beam_thickness 1.8
cursor_trail 3
cursor_trail_decay 0.1 0.35
cursor_blink_interval 0.6
cursor_stop_blinking_after 10

# --- Scrollback ---
scrollback_lines 10000
# Plain text in the pager (Ctrl+F), searchable with /.
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# --- Tabs (Ctrl+Shift+T new, Ctrl+Shift+Q close, Ctrl+Shift+Left / Right switch) ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_title_template "{index}: {title[:30]}"

# --- Links ---
url_style curly
detect_urls yes
open_url_with default

# --- Keys ---
# Ctrl+C copies when something is selected, else interrupts as usual.
map ctrl+c copy_or_interrupt
map ctrl+shift+v paste_from_clipboard
# Search: the scrollback in a pager, / to search.
map ctrl+f show_scrollback
map ctrl+shift+f show_scrollback
map page_up scroll_page_up
map page_down scroll_page_down
# Zoom
map ctrl+plus change_font_size all +1
map ctrl+equal change_font_size all +1
map ctrl+kp_add change_font_size all +1
map ctrl+minus change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
# Splits inside a tab
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
enabled_layouts splits,stack
