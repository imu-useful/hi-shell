#? btop config from hi-shell (install.sh puts it in ~/.config/btop; your previous
#? btop.conf is kept next to it as btop.conf.backup-<date>). btop fills in every option
#? it doesn't find here and writes them all back when it quits. Edit freely.

# The colors follow the wallpaper: hi-shell's services/TerminalColors.qml writes
# ~/.config/btop/themes/hi-shell.theme and open btops reload it when the palette changes.
color_theme = "hi-shell"

# Keep the terminal's own (translucent) background.
theme_background = False
truecolor = True

rounded_corners = True
graph_symbol = "braille"
update_ms = 1000
vim_keys = False
