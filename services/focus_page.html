<!doctype html>
<!-- Focus Mode page, served by services/focus_hosts.py for blocked sites. Colors, text
     and the phase come from /__focus/state (written by services/FocusBlocker.qml). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Mode</title>
<style>
  :root {
    --surface: #141218; --container: #211f26; --high: #2b2930; --on-surface: #e6e0e9;
    --variant: #cac4d0; --primary: #d0bcff; --on-primary: #381e72; --primary-container: #4f378b;
    --on-primary-container: #eaddff; --tertiary: #efb8c8; --outline: #938f99;
    --font: system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px;
    background: radial-gradient(circle at 50% 30%, var(--primary-container) 0%, var(--surface) 60%);
    color: var(--on-surface); font-family: var(--font);
  }
  main {
    width: min(560px, 100%); padding: 40px 32px 32px; border-radius: 28px;
    background: var(--container); text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, .25);
    animation: rise .5s cubic-bezier(.05, .7, .1, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96); } }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 99px;
    background: var(--high); color: var(--variant); font-size: 14px; font-weight: 500;
  }
  .chip svg { width: 18px; height: 18px; fill: var(--tertiary); }
  h1 { margin: 20px 0 8px; font-size: 32px; font-weight: 500; letter-spacing: -.01em; }
  p.sub { color: var(--variant); font-size: 16px; line-height: 1.5; }
  .ring { position: relative; width: 220px; height: 220px; margin: 28px auto 20px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
  .ring .track { stroke: var(--high); }
  .ring .bar { stroke: var(--primary); transition: stroke-dashoffset 1s linear; }
  .ring .time {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 2px;
  }
  .ring .time b { font-size: 46px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ring .time span { color: var(--variant); font-size: 14px; }
  blockquote {
    margin-top: 8px; padding: 16px 20px; border-radius: 16px; background: var(--primary-container);
    color: var(--on-primary-container); font-size: 15px; line-height: 1.5;
  }
  footer { margin-top: 20px; color: var(--outline); font-size: 13px; }
</style>
</head>
<body>
<main>
  <span class="chip"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2c1.85 0 3.55.63 4.9 1.69L5.69 16.9A8 8 0 0 1 12 4Zm0 16a7.96 7.96 0 0 1-4.9-1.69L18.31 7.1A8 8 0 0 1 12 20Z"/></svg><span id="host"></span></span>
  <h1 id="title">Focus Mode</h1>
  <p class="sub" id="sub"></p>
  <div class="ring">
    <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="bar" id="bar" cx="60" cy="60" r="52"/></svg>
    <div class="time"><b id="left">--:--</b><span id="until"></span></div>
  </div>
  <blockquote id="quote" style="display: none"></blockquote>
  <footer id="footer">hi-shell</footer>
</main>
<script>
  const $ = id => document.getElementById(id);
  const C = 2 * Math.PI * 52;
  $("bar").style.strokeDasharray = C;
  $("host").textContent = location.hostname;
  let state = null;

  function pad(n) { return String(n).padStart(2, "0"); }

  function tick() {
    if (!state) return;
    const s = Math.max(0, Math.round((state.end - Date.now()) / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
    $("left").textContent = h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${pad(m)}:${pad(s % 60)}`;
    const length = Math.max(1, state.end - state.start);
    $("bar").style.strokeDashoffset = C * Math.min(1, Math.max(0, (Date.now() - state.start) / length));
    if (s === 0) setTimeout(load, 1500);
  }

  async function load() {
    try {
      const r = await fetch("/__focus/state", { cache: "no-store" });
      const next = await r.json();
      if (!next.end) return;
      const first = !state;
      state = next;
      const c = next.colors || {};
      for (const k in c) document.documentElement.style.setProperty(`--${k}`, c[k]);
      if (next.font) document.documentElement.style.setProperty("--font", `"${next.font}", system-ui, sans-serif`);
      document.documentElement.lang = next.lang || "en";
      document.title = next.title;
      $("title").textContent = next.title;
      $("sub").textContent = next.subtitle;
      $("until").textContent = next.until;
      $("footer").textContent = next.footer;
      if (first && next.quotes && next.quotes.length)
        $("quote").textContent = next.quotes[Math.floor(Math.random() * next.quotes.length)];
      $("quote").style.display = $("quote").textContent ? "" : "none";
      tick();
    } catch (e) {}
  }

  load();
  setInterval(tick, 1000);
  setInterval(load, 15000);
</script>
</body>
</html>
